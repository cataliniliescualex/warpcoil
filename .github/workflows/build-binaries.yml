name: Build WarpCoil standalone apps

on:
  push:
    branches: [main, feature/standalone-binaries]
    paths:
      - '.github/workflows/build-binaries.yml'
      - 'WarpCoil.spec'
      - 'localdrop.py'
      - 'app.js'
      - 'index.html'
      - 'style.css'
      - 'scripts/package_binaries.py'
      - 'tests/smoke_binary.py'
      - 'BINARY_INSTALL.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            label: Windows x64
            platform: windows
          - runner: ubuntu-22.04
            label: Linux x64 (Ubuntu 22.04+)
            platform: linux
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install packaging dependency
        run: python -m pip install --disable-pip-version-check 'pyinstaller==6.16.0'
      - name: Run existing unit tests
        run: python -m unittest -v test_localdrop.py
      - name: Build standalone executable
        run: python -m PyInstaller --noconfirm --clean WarpCoil.spec
      - name: Smoke-test packaged executable, including actual upload
        run: python tests/smoke_binary.py
      - name: Package application and license
        run: python scripts/package_binaries.py --platform ${{ matrix.platform }}
      - name: Upload downloadable build
        uses: actions/upload-artifact@v4
        with:
          name: WarpCoil-${{ matrix.platform }}-x64
          path: release/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Attach compiled binaries to v1.3.2 release
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && contains(github.event.head_commit.message, '[publish v1.3.2 binaries]')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download verified build packages
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Attach Windows and Linux binaries to existing beta release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f artifacts/WarpCoil-windows-x64/WarpCoil-Windows-x64.zip
          test -f artifacts/WarpCoil-linux-x64/WarpCoil-Linux-x64.tar.gz
          gh release upload v1.3.2 \
            artifacts/WarpCoil-windows-x64/WarpCoil-Windows-x64.zip \
            artifacts/WarpCoil-linux-x64/WarpCoil-Linux-x64.tar.gz \
            --repo "$GITHUB_REPOSITORY" --clobber
